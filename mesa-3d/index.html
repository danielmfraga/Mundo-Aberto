<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mesa 3D</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root { --fundo:#1b1830; --painel:#262142; --borda:#3b3463; --texto:#e9e4ff; --suave:#9a93c4; --realce:#ffcf5c; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--fundo); color:var(--texto);
    font:13px/1.35 ui-monospace, "Cascadia Mono", Consolas, monospace; overflow:hidden; }
  .app { display:flex; flex-direction:column; height:100%; }
  .barra { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:8px 12px;
    background:var(--painel); border-bottom:2px solid var(--borda); }
  .grupo { display:flex; gap:4px; align-items:center; }
  .grupo > label { color:var(--suave); margin-right:2px; }
  button, select { font:inherit; color:var(--texto); background:#322c57; border:2px solid var(--borda);
    padding:5px 9px; cursor:pointer; border-radius:0; }
  button:hover:not(:disabled), select:hover { border-color:var(--suave); }
  button:disabled { opacity:.4; cursor:default; }
  .ferr.on { background:var(--realce); color:#241c05; border-color:var(--realce); font-weight:700; }
  .cores { display:flex; gap:3px; }
  .cores.apagado { opacity:.3; pointer-events:none; }
  .cor { width:24px; height:24px; padding:0; border:2px solid #0006; }
  .cor.on { border-color:#fff; box-shadow:0 0 0 2px var(--fundo), 0 0 0 4px var(--realce); }
  .sp { flex:1; }
  .grupo[hidden] { display:none; }
  .val { min-width:1.6em; text-align:center; font-size:15px; }
  .suave { color:var(--suave); }
  .tex.on { background:var(--realce); color:#241c05; border-color:var(--realce); font-weight:700; }
  #cena { position:relative; flex:1; min-height:0; display:grid; place-items:center; overflow:hidden; background:var(--fundo); }
  #cena canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none; cursor:crosshair; }
  .rodape { display:flex; flex-wrap:wrap; gap:4px 18px; padding:6px 12px; background:var(--painel);
    border-top:2px solid var(--borda); color:var(--suave); }
  .rodape b { color:var(--texto); font-weight:400; }
  #aviso { position:absolute; left:50%; top:12px; transform:translateX(-50%); background:#2b6b3a; color:#fff;
    padding:6px 12px; border:2px solid #0006; }
  #aviso.erro { background:#8a2b2b; }
  #aviso[hidden] { display:none; }
  .chk { display:flex; gap:5px; align-items:center; cursor:pointer; }
  @media (max-width:640px) { .ajuda { display:none; } }
</style>
</head>
<body>
<div class="app">
  <div class="barra">
    <div class="grupo" id="ferrs">
      <button class="ferr" data-t="terreno" title="Terreno (1)">▦ Terreno</button>
      <button class="ferr" data-t="muro" title="Muro (2) — arraste para fazer uma linha">▮ Muro</button>
      <button class="ferr" data-t="criatura" title="Criatura flutuante (3)">◆ Criatura</button>
      <button class="ferr" data-t="apagar" title="Apagar (4)">✕ Apagar</button>
    </div>
    <div class="cores" id="cores"></div>
    <div class="grupo" id="opMuro" hidden>
      <label>Altura</label>
      <button id="altMenos" title="Muro mais baixo ([)">−</button>
      <b id="altVal" class="val">2</b>
      <button id="altMais" title="Muro mais alto (])">+</button>
      <span id="altM" class="suave"></span>
      <label style="margin-left:8px">Textura</label>
      <div class="grupo" id="texs"></div>
    </div>
    <div class="sp"></div>
    <div class="grupo">
      <label for="pixel">Pixel</label>
      <select id="pixel">
        <option value="2">2×</option><option value="3">3×</option>
        <option value="4" selected>4×</option><option value="6">6×</option><option value="8">8×</option>
      </select>
    </div>
    <div class="grupo">
      <label for="tam">Tabuleiro</label>
      <select id="tam">
        <option value="10">10×10</option><option value="16">16×16</option><option value="20">20×20</option>
        <option value="30">30×30</option><option value="40">40×40</option>
      </select>
    </div>
    <label class="chk"><input type="checkbox" id="encaixe"> Encaixar ângulo</label>
    <div class="grupo">
      <button id="desfazerBt" title="Desfazer (Ctrl+Z)">↶ Desfazer</button>
      <button id="limparBt">Limpar</button>
      <button id="exportaBt">Salvar</button>
      <button id="importaBt">Abrir</button>
      <input type="file" id="arquivo" accept="application/json,.json" hidden>
    </div>
  </div>
  <div id="cena"><div id="aviso" hidden></div></div>
  <div class="rodape">
    <b id="celula">—</b>
    <span id="contagem"></span>
    <span class="sp"></span>
    <span class="ajuda">esquerdo: ferramenta · direito: girar · roda: zoom · meio: mover · 1–4: ferramentas · Ctrl+Z: desfazer · toque: 1 dedo ferramenta, 2 dedos câmera</span>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
